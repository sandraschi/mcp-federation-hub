# Root-level ruff config. bridge/ has its own pyproject.toml (governs bridge/
# independently, nearest-config-wins); this file exists so paths outside
# bridge/ (e.g. scripts/) aren't linted with bare ruff defaults and no
# repo-specific exceptions at all.
line-length = 120
target-version = "py312"

[lint]
select = ["E", "F", "W", "I", "S", "UP", "RUF"]
ignore = ["S101", "S106", "RUF012", "S603", "S607", "S324", "E402"]

[lint.per-file-ignores]
"scripts/**" = ["T201", "S110", "S310", "BLE001", "C401", "E501"]
