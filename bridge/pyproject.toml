[project]
name = "bridge-backend"
version = "0.1.0"
description = "MCP Federation Hub — bridge backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.134.0",
    "fastmcp>=3.1.0",
    "httpx>=0.28.1",
    "mcp>=1.26.0",
    "ollama>=0.6.1",
    "openai>=2.24.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.1",
    "structlog>=25.5.0",
    "uvicorn[standard]>=0.41.0",
    "sse-starlette>=2.1.0",
    "psutil>=7.1.0",
]

[dependency-groups]
dev = [
    "black>=26.1.0",
    "flake8>=7.3.0",
    "isort>=8.0.0",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pre-commit>=4.6.1",
    "ruff>=0.16.0,<0.17",
]
