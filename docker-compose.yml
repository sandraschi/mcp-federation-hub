version: '3.8'

services:
  # Federation Bridge (FastAPI)
  federation-bridge:
    build:
      context: ./bridge
      dockerfile: Dockerfile
    ports:
      - "10857:8000"
    environment:
      - FEDERATION_CONFIG_PATH=/app/federation-config.json
    volumes:
      - ./federation-config.json:/app/federation-config.json:ro
    networks:
      - federation-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Unified Dashboard (React)
  federation-dashboard:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    ports:
      - "10856:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:10857
    depends_on:
      federation-bridge:
        condition: service_healthy
    networks:
      - federation-network
    restart: unless-stopped

  # Documentation Hub (Optional)
  federation-docs:
    build:
      context: ./docs
      dockerfile: Dockerfile
    ports:
      - "10855:4000"
    networks:
      - federation-network
    restart: unless-stopped

  # WorldLabs MCP Server
  worldlabs-mcp:
    build:
      context: ./worldlabs-mcp
      dockerfile: Dockerfile
    ports:
      - "7784:7784"
    environment:
      - WORLDLABS_API_KEY=${WORLDLABS_API_KEY}
      - PORT=7784
    networks:
      - federation-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7784/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

networks:
  federation-network:
    driver: bridge

volumes:
  federation-data:
    driver: local